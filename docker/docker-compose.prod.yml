version: "3.8"

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: nelya_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # ✅ PAS DE PORT EXPOSÉ - Communication interne uniquement
    # Sécurité: La base de données n'est accessible que par les autres conteneurs
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres-backups:/backups  # Pour les backups
    networks:
      - nelya_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: nelya_backend_prod
    restart: always
    # ✅ PAS DE PORT EXPOSÉ - Accessible via Nginx uniquement
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGIN=${FRONTEND_URL}
    # ✅ PAS DE VOLUME DE CODE MONTÉ - Image immuable
    volumes:
      - backend_uploads:/app/src/img  # Persistance des images uploadées
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nelya_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Angular
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: nelya_frontend_prod
    restart: always
    # ✅ PAS DE PORT EXPOSÉ - Accessible via Reverse Proxy uniquement
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - nelya_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reverse Proxy Nginx avec SSL
  nginx:
    image: nginx:alpine
    container_name: nelya_nginx_prod
    restart: always
    ports:
      - "80:80"      # HTTP (redirige vers HTTPS)
      - "443:443"    # HTTPS
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # Certificats SSL
      - ./nginx/logs:/var/log/nginx    # Logs Nginx
    depends_on:
      - frontend
      - backend
    networks:
      - nelya_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ❌ PAS D'ADMINER EN PRODUCTION - Supprimé pour la sécurité

  # Service de backup automatique
  backup:
    image: postgres:15-alpine
    container_name: nelya_backup_prod
    restart: "no"  # Exécuté par cron ou orchestrateur externe
    environment:
      - PGHOST=db
      - PGUSER=${DB_USER}
      - PGPASSWORD=${DB_PASSWORD}
      - PGDATABASE=${DB_NAME}
    volumes:
      - ./postgres-backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - nelya_network
    depends_on:
      - db
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  db_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  nelya_network:
    driver: bridge
