# Pile de production en HTTP, pour valider nginx + API + front sur la machine
# de développement, sans certificat Let's Encrypt.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.http.yml up --build
#
# Le site répond sur http://localhost:8080

services:
  backend:
    environment:
      ALLOWED_ORIGIN: http://localhost:8080

  nginx:
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/http-local:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
