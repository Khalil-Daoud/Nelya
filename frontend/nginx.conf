server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy pour l'API backend en production (évite les problèmes de CORS et d'IP hardcodée)
  location ^~ /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy pour les images depuis le backend
  # ^~ : prioritaire sur les regex d'assets statiques ci-dessous (sinon 404 sur /img)
  location ^~ /img/ {
    proxy_pass http://backend:3000/img/;
  }

  # [BUG-009 FIX] Essentiel pour les SPA Angular avec routing HTML5.
  # Sans ceci, accéder directement à /collection, /cart, etc.
  # retourne une erreur 404 Nginx au lieu de charger l'app Angular.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache pour les assets statiques (JS, CSS, images)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Désactiver le cache pour index.html (pour les mises à jour)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
