# ============================================
# CONFIGURATION NGINX DE PRODUCTION
# ============================================

server {
  listen ${PORT};
  listen [::]:${PORT};
  server_name _;
  
  root /usr/share/nginx/html;
  index index.html;

  # Sécurité: Cacher la version de Nginx
  server_tokens off;

  # Logs
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  # Taille maximale des requêtes
  client_max_body_size 10M;

  # Compression Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/rss+xml
    font/truetype
    font/opentype
    application/vnd.ms-fontobject
    image/svg+xml;

  # Sur Railway le front et l'API sont deux services. Sans ce proxy, POST /api
  # tombe sur try_files (405) et /img/huile.jpg fait 404.
  location ^~ /api/ {
    proxy_pass ${BACKEND_URL}/api/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location ^~ /img/ {
    proxy_pass ${BACKEND_URL}/img/;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
  }

  # Routing SPA Angular - ESSENTIEL pour les routes frontend
  location / {
    try_files $uri $uri/ /index.html;
    
    # Headers de sécurité supplémentaires
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
  }

  # Cache agressif pour les assets statiques
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Pas de cache pour index.html (pour les mises à jour)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Bloquer l'accès aux fichiers sensibles
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Healthcheck endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
